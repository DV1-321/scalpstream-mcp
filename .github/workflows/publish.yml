# Publish the container image and register the server with the official MCP
# Registry, on every version tag.
#
# WHY OIDC RATHER THAN A TOKEN
#   `mcp-publisher login github` is an interactive device flow, and
#   `login dns`/`login http` need a long-lived signing key kept somewhere. GitHub
#   Actions OIDC needs neither: the runner proves this repository's identity to
#   the registry directly, so the io.github.DV1-321/* namespace is authenticated
#   with no secret to store, leak, or rotate.
#
# The image is built with ko, which produces a multi-arch image from Go source
# without a Docker daemon.

name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      packages: write # push the image to ghcr.io
      id-token: write # mint the OIDC token the registry verifies

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Tests gate the release. A tag that fails them must not become a version
      # someone installs.
      - name: Test
        run: go test -race ./...

      # Pinned to the commit, not the tag: this job holds packages:write and an
      # OIDC token, and a moving tag would hand both to whatever it points at
      # next. v0.10 also hardens the action against shell-expression and
      # env-file injection (setup-ko PR #66).
      - name: Install ko
        uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10

      # ko authenticates to registries through the standard docker credential
      # store, which is empty on a fresh runner. Without this the push fails with
      # a bare 403 on a blob HEAD, which does not look like an auth error at all.
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | ko login ghcr.io --username "${{ github.actor }}" --password-stdin

      # The tag is the single source of truth, and everything else must ALREADY
      # agree with it. This used to rewrite server.json here instead, which meant
      # the committed file was permanently one release behind and nobody found
      # out — v0.1.4 published while the repo still said 0.1.3.
      #
      # A check that fails the release is better than a fixup that hides the
      # drift: the version a user sees comes from three places (this tag, the
      # registry entry, and the binary's own serverInfo) and they are only
      # trustworthy if they cannot silently disagree.
      - name: Version must match the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 - "$VERSION" "$GITHUB_REF_NAME" <<'PY'
          import json, sys
          version, ref = sys.argv[1], sys.argv[2]
          with open("server.json") as f:
              s = json.load(f)
          bad = []
          if s["version"] != version:
              bad.append(f'server.json version is {s["version"]!r}, tag says {version!r}')
          want = f"ghcr.io/dv1-321/scalpstream-mcp:{ref}"
          for p in s.get("packages", []):
              if p.get("registryType") == "oci" and p.get("identifier") != want:
                  bad.append(f'server.json oci identifier is {p.get("identifier")!r}, want {want!r}')
          if bad:
              print("Release blocked — bump these to match the tag before tagging:")
              for b in bad:
                  print("  - " + b)
              sys.exit(1)
          print(f"server.json agrees with {ref}")
          PY

      - name: Build and push image
        env:
          KO_DOCKER_REPO: ghcr.io/dv1-321/scalpstream-mcp
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Stamp the version INTO the binary, so `initialize` reports the same
          # number the image tag and the registry entry carry. ko builds through
          # `go build` and honours GOFLAGS; the previous step computed VERSION
          # and then never passed it, so every published image reported the
          # hardcoded fallback instead — v0.1.4's image said 0.1.3.
          export GOFLAGS="-ldflags=-X=main.buildVersion=${VERSION}"
          ko build ./cmd/scalpmcp \
            --bare \
            --platform=linux/amd64,linux/arm64 \
            --tags="${GITHUB_REF_NAME},latest" \
            --image-label "io.modelcontextprotocol.server.name=io.github.DV1-321/scalpstream-mcp"

      # A fixed release, checked against the checksum the registry project
      # published for it, before anything from the download is executed. This
      # used to stream `latest` straight into tar, which ran whatever the
      # newest release happened to be, with the OIDC token and packages:write
      # in hand.
      #
      # To bump: change both values together. The hash is the
      # mcp-publisher_linux_amd64.tar.gz line of registry_<version>_checksums.txt
      # on the release page.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          curl -sSLf --retry 3 -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher
          rm -f mcp-publisher.tar.gz

      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
